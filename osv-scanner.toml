[[IgnoredVulns]]
id = "GHSA-jmr9-qjv8-65gv"
ignoreUntil = 2026-10-06
reason = "extract-zip 2.0.1 has no patched release. Electron 39's development installer is its only dependency path and verifies the trusted Electron archive against checksums.json before extraction. This does not make extract-zip safe for untrusted archives; Orpheus does not use it to process user archives. Newer Electron releases use @electron-internal/extract-zip. Re-evaluate on an Electron upgrade or before expiry."
