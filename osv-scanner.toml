reason = "@modelcontextprotocol/sdk 1.29.0 (latest stable) requires @hono/node-server 1.x. The advisory affects Windows serve-static routing; Orpheus is macOS-only and uses MCP over stdio, so this adapter path is unreachable. Re-evaluate before expiry or when the MCP SDK accepts @hono/node-server >=2.0.5."

[[IgnoredVulns]]
id = "GHSA-rgw5-rvv9-x895"
ignoreUntil = 2026-11-05
reason = "brace-expansion 1.x/2.x/5.0.8, reached only via minimatch under ESLint, electron-builder, and @electron/universal — all build-time tooling that never ships in the Electron runtime. Each parent pins its own major, so no direct bump reaches them; bun update promotes them to direct deps instead, which is worse. Re-evaluate when those toolchains move, or before expiry."

