appId: dev.orpheus.app
productName: Orpheus
# Re-sign the whole bundle as a single ad-hoc unit after electron-builder's
# per-component signing pass. This unifies Team IDs across all inner frameworks
# (Electron Framework.framework, Squirrel.framework, etc.) so macOS 15+ doesn't
# refuse to load them at launch. See build/afterSign.mjs for details.
afterSign: ./build/afterSign.mjs
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  # Native .node bundles cannot be loaded from inside an asar archive;
  # electron-builder extracts anything matching these globs to app.asar.unpacked/
  - resources/**
  - '**/*.node'
  # better-sqlite3 + its runtime deps must be fully unpacked so the CLI bundle
  # (Resources/cli/cli.cjs, loaded via the shim's NODE_PATH) can resolve them —
  # better-sqlite3 does a dynamic require('bindings'), which is otherwise left
  # packed inside app.asar and unreachable.
  - node_modules/better-sqlite3/**
  - node_modules/bindings/**
  - node_modules/file-uri-to-path/**
extraResources:
  # Copy each native addon's built .node file into Contents/Resources/packages/<pkg>/
  # so the main process can load them from process.resourcesPath at runtime.
  - from: packages/ghostty-surface/build/Release/ghostty_native.node
    to: packages/ghostty-surface/ghostty_native.node
  # Ghostty terminfo sentinel — must live at Contents/Resources/terminfo/78/xterm-ghostty
  # so Ghostty's auto-walk (resourcesdir.zig) finds the bundle when scanning up from the
  # Contents/MacOS/Orpheus executable.
  - from: resources/ghostty/terminfo
    to: terminfo
    filter:
      - '**/*'
  # Ghostty resources dir — shell-integration scripts etc.
  # Ghostty sets app_path = Contents/Resources/ghostty after the sentinel walk.
  - from: resources/ghostty/ghostty
    to: ghostty
    filter:
      - '**/*'
  # Icon-pack catalog (Settings > General "App icon" picker) — see
  # resources/icon-sets/README.md and src/main/iconPacks.ts, which resolves
  # this dir via process.resourcesPath at runtime in packaged builds.
  - from: resources/icon-sets
    to: icon-sets
    filter:
      - '**/*'
  # Wrapper script: runs claude in a login zsh, then exec's interactive zsh
  # after claude exits so the terminal stays alive for further use.
  - from: resources/orpheus-claude.sh
    to: orpheus-claude.sh
  # Universal tmux hosting: attaches the desktop native surface to the
  # tmux session hostWorkspace() (src/main/tmuxHost.ts) already created —
  # same stay-alive rationale as orpheus-claude.sh above, applied to the
  # attach path instead of the create path.
  - from: resources/orpheus-attach.sh
    to: orpheus-attach.sh
  # Workbench Panes tab (U12) wrapper: runs a pane's declared command in a
  # login zsh, then exec's interactive zsh after it exits — same
  # stay-alive rationale as orpheus-claude.sh above.
  - from: resources/orpheus-pane.sh
    to: orpheus-pane.sh
  # Hook notification shim — invoked by Claude Code hooks to post activity events
  # to Orpheus's Unix-domain socket. Lives at Contents/Resources/bin/orpheus-notify.
  - from: resources/bin/orpheus-notify
    to: bin/orpheus-notify
  # Orpheus CLI shim — runs the bundled CLI via Electron-as-Node.
  # Lives at Contents/Resources/bin/orpheus; prepended to PATH in workspace terminals.
  - from: resources/bin/orpheus
    to: bin/orpheus
  # Bundled Orpheus CLI — single CJS bundle with better-sqlite3 externalised.
  # Lives at Contents/Resources/cli/cli.cjs; executed by the bin/orpheus shim.
  - from: packages/orpheus-cli/dist/cli.cjs
    to: cli/cli.cjs
  # TUI bundle (`orpheus tui`) — separate ESM bundle, lazy dynamic-import()'d
  # by cli.cjs at runtime (see commands/tui.ts's file header). Ships alongside
  # cli.cjs at Contents/Resources/cli/tui.mjs since it's resolved via
  # __dirname relative to cli.cjs. `--splitting` emits content-hashed sibling
  # chunks (chunk-*.mjs, devtools-*.mjs) whose names change between builds, so
  # this globs the whole dist dir for *.mjs rather than naming files.
  - from: packages/orpheus-cli/dist
    to: cli
    filter:
      - '*.mjs'
  # OpenTUI native dylib (packaging smoke test / future OpenTUI TUI), staged
  # by scripts/package-tui-assets.mjs at packages/orpheus-cli/dist/@opentui/.
  # electron-builder's default filter only matches top-level files by
  # extension, so the *.mjs glob above would silently NOT pick up this nested
  # binary asset — it needs its own explicit entry.
  - from: packages/orpheus-cli/dist/@opentui
    to: cli/@opentui
    filter:
      - '**/*'
  # Bundled Bun runtime (darwin-arm64) — fetched by scripts/fetch-bun.sh into
  # vendor/bun/ (gitignored, never committed; see that script's header for
  # why it's vendored separately from node_modules/bun). Execed by
  # resources/bin/orpheus for the OpenTUI/Bun-only codepaths that cannot run
  # under Electron-as-Node (see @opentui/core's node:ffi dependency).
  - from: vendor/bun/bun
    to: bin/bun
  # Standalone MCP stdio bridge. It is intentionally separate from the CLI
  # registry so stdout remains reserved for MCP JSON-RPC frames.
  - from: resources/bin/orpheus-mcp
    to: bin/orpheus-mcp
  - from: packages/orpheus-mcp/dist/mcp.cjs
    to: mcp/mcp.cjs
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Distribution: Homebrew Cask via amitray007/homebrew-tap.
# Releases are published manually via `bun run release`, which uploads the
# .dmg to amitray007/orpheus releases and bumps the cask file in the tap.
# No electron-builder auto-publish; no electron-updater. See scripts/release.mjs.
