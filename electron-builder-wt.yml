appId: dev.orpheus.wt
productName: Orpheus WT
directories:
  buildResources: build
  output: dist-wt
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - '**/*.node'
  - node_modules/better-sqlite3/**
  - node_modules/bindings/**
  - node_modules/file-uri-to-path/**
extraResources:
  - from: packages/ghostty-surface/build/Release/ghostty_native.node
    to: packages/ghostty-surface/ghostty_native.node
  - from: resources/ghostty/terminfo
    to: terminfo
    filter:
      - '**/*'
  - from: resources/ghostty/ghostty
    to: ghostty
    filter:
      - '**/*'
  - from: resources/orpheus-claude.sh
    to: orpheus-claude.sh
  - from: resources/orpheus-attach.sh
    to: orpheus-attach.sh
  - from: resources/orpheus-pane.sh
    to: orpheus-pane.sh
  - from: resources/bin/orpheus-notify
    to: bin/orpheus-notify
  - from: resources/bin/orpheus
    to: bin/orpheus
  - from: packages/orpheus-cli/dist/cli.cjs
    to: cli/cli.cjs
  # TUI bundle (`orpheus tui`) — separate ESM bundle, lazy dynamic-import()'d
  # by cli.cjs at runtime (see commands/tui.ts's file header). Ships alongside
  # cli.cjs at Contents/Resources/cli/tui.mjs since it's resolved via
  # __dirname relative to cli.cjs. `--splitting` emits content-hashed sibling
  # chunks (chunk-*.mjs, devtools-*.mjs) whose names change between builds, so
  # this globs the whole dist dir for *.mjs rather than naming files.
  - from: packages/orpheus-cli/dist
    to: cli
    filter:
      - '*.mjs'
  # OpenTUI native dylib (packaging smoke test / future OpenTUI TUI), staged
  # by scripts/package-tui-assets.mjs at packages/orpheus-cli/dist/@opentui/.
  # electron-builder's default filter only matches top-level files by
  # extension, so the *.mjs glob above would silently NOT pick up this nested
  # binary asset — it needs its own explicit entry.
  - from: packages/orpheus-cli/dist/@opentui
    to: cli/@opentui
    filter:
      - '**/*'
  # Bundled Bun runtime (darwin-arm64) — fetched by scripts/fetch-bun.sh into
  # vendor/bun/ (gitignored, never committed; see that script's header for
  # why it's vendored separately from node_modules/bun). Execed by
  # resources/bin/orpheus for the OpenTUI/Bun-only codepaths that cannot run
  # under Electron-as-Node (see @opentui/core's node:ffi dependency).
  - from: vendor/bun/bun
    to: bin/bun
  - from: resources/bin/orpheus-mcp
    to: bin/orpheus-mcp
  - from: packages/orpheus-mcp/dist/mcp.cjs
    to: mcp/mcp.cjs
  # Geist Sans TTFs for native popover cards. Packaged at Contents/Resources/fonts/
  # so registerPopoverFonts() can resolve them via process.resourcesPath.
  - from: node_modules/geist/dist/fonts/geist-sans
    to: fonts/geist-sans
    filter:
      - '*.ttf'
  - from: node_modules/geist/dist/fonts/geist-mono
    to: fonts/geist-mono
    filter:
      - '*.ttf'
mac:
  icon: build/icon-dev.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  # Skip electron-builder's internal ad-hoc codesign for the WT build. It races
  # on this toolchain (intermittent "Application ... could not be found" at the
  # sign step). scripts/install-mac.mjs re-signs the whole bundle ad-hoc
  # (codesign --force --deep --sign -) right after install, so the in-builder
  # sign is redundant here anyway.
  identity: null
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Use the pre-extracted Electron dist from node_modules rather than downloading
# and re-extracting the zip via app-builder (which fails intermittently on
# macOS 27 / Xcode Beta due to permission handling in the Go extractor).
electronDist: node_modules/electron/dist
# WT builds: install to /Applications/Orpheus WT.app, own data at
# ~/Library/Application Support/Orpheus WT/. Never released via Homebrew.
